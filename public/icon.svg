<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#1E293B" stroke-width="20" stroke-dasharray="10 14" opacity="0.6" />

  <!-- Modern Geometric Chart & Wallet Emblem -->
  <!-- Ascending Bar 1 -->
  <rect x="144" y="270" width="44" height="110" rx="14" fill="#3B82F6" opacity="0.85" />
  <!-- Ascending Bar 2 -->
  <rect x="206" y="210" width="44" height="170" rx="14" fill="#06B6D4" />
  <!-- Ascending Bar 3 -->
  <rect x="268" y="150" width="44" height="230" rx="14" fill="url(#primaryGrad)" filter="url(#glow)" />
  <!-- Ascending Bar 4 -->
  <rect x="330" y="230" width="44" height="150" rx="14" fill="#8B5CF6" opacity="0.9" />

  <!-- Trend Arrow overlay -->
  <path d="M 150 250 L 220 190 L 290 130 L 360 170" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="334,170 360,170 360,144" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Sparkling / Currency node -->
  <circle cx="290" cy="130" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="6" />
</svg>
